name: EcoDex Flutter CI/CD

on:
  push:
    branches: [ EcoDex-App, main ]
  pull_request:
    branches: [ EcoDex-App, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Job 1: Analyze & Test ───────────────────────────────────────────────
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  # ─── Job 2: Build Android APK ────────────────────────────────────────────
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze_and_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecodex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── Job 3: Deploy Summary ───────────────────────────────────────────────
  deploy_summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: build_android
    if: github.ref == 'refs/heads/EcoDex-App'

    steps:
      - name: Summary
        run: echo "EcoDex CI/CD Pipeline Complete - APK available in artifacts"